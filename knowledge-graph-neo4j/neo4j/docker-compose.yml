# docker-compose.yml
# ------------------
# Spins up a local Neo4j graph database in Docker.
#
# Usage:
#   docker compose up -d      # start Neo4j in the background
#   docker compose logs -f    # watch it start up (takes ~15-30s to be ready)
#   docker compose down       # stop it (add -v to also wipe stored data)
#
# Once it's running:
#   Neo4j Browser (visual UI): http://localhost:7474
#   Bolt (used by the Python driver): bolt://localhost:7687
#   Login: neo4j / password123   (set below via NEO4J_AUTH)

services:
  neo4j:
    image: neo4j:5
    container_name: kb_graph_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol (used by the Python driver)
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neo4j_data:
